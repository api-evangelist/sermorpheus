description: >-
  SerMorpheus was an Indonesian Web3 / digital-collectibles startup surfaced as a portfolio company of
  500 Global. As of the July 2026 enrichment probe the SerMorpheus brand appears defunct - the
  sermorpheus.com domain (including the app.sermorpheus.com application host) now 301-redirects to
  https://normi.es/ (Normies, a distinct Web3 FIAT-settlement payment-infrastructure platform), and no
  SerMorpheus-branded API, developer portal, documentation, or specification could be located. No API
  artifacts were generated for this repo to avoid fabricating a surface that no longer exists or
  conflating SerMorpheus with the unrelated Normies brand now on the domain.
